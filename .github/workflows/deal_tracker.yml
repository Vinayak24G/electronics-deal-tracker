name: Amazon & Flipkart Electronics Deal Tracker (Zero-Cost Cron)

on:
  schedule:
    # Runs automatically every 30 minutes (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allows manual 1-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scan-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Amazon.in & Flipkart Deal Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python deal_tracker_bot.py --once --config config.json --db deals_history.db

      - name: Persist updated SQLite price history back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals_history.db
          git diff --staged --quiet || git commit -m "chore(db): update electronics price history [skip ci]"
          git push
